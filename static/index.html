<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepBot — RAG over interview notes</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#272b38; --text:#e6e8ee; --muted:#8b91a3; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 20px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:24px; }
  #log { display:flex; flex-direction:column; gap:14px; margin-bottom:20px; }
  .msg { padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); }
  .msg.user { background:transparent; border-color:transparent; color:var(--accent); padding:0 4px; font-weight:600; }
  .msg.err { border-color:#5c2b2b; color:#ffb4b4; }
  .sources { margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
             font-size:12.5px; color:var(--muted); }
  .sources b { color:var(--text); font-weight:600; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
          background:var(--panel); color:var(--text); font-size:15px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:12px 20px; border-radius:10px; border:none; background:var(--accent);
           color:#0f1117; font-weight:600; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { margin-top:14px; font-size:13px; color:var(--muted); }
  .hint span { cursor:pointer; text-decoration:underline dotted; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PrepBot</h1>
  <div class="sub">Retrieval-augmented answers from a set of interview-preparation notes.
    Answers come only from the indexed documents — if it isn't in there, it says so.</div>

  <div id="log"></div>

  <form id="form">
    <input id="q" placeholder="e.g. Why does exponential backoff need jitter?" autocomplete="off" required>
    <button id="send" type="submit">Ask</button>
  </form>

  <div class="hint">Try:
    <span class="ex">What is RAG and why does it exist?</span> ·
    <span class="ex">Difference between DELETE, TRUNCATE and DROP</span> ·
    <span class="ex">Why unsubscribe in ngOnDestroy?</span>
  </div>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('q');
const send = document.getElementById('send');

function add(cls, html) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.innerHTML = html;
  log.appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return el;
}

const escape = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

document.querySelectorAll('.ex').forEach(e => {
  e.onclick = () => { input.value = e.textContent; input.focus(); };
});

form.onsubmit = async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  add('user', escape(question));
  input.value = '';
  send.disabled = true;
  const pending = add('bot', '<span style="color:var(--muted)">thinking…</span>');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();

    let html = escape(data.answer).replace(/\n/g, '<br>');
    if (data.sources.length) {
      const list = data.sources
        .map(s => `<b>${escape(s.source)}</b> — ${escape(s.heading)} <i>(${s.similarity})</i>`)
        .join('<br>');
      html += `<div class="sources">Retrieved from:<br>${list}</div>`;
    }
    pending.innerHTML = html;
  } catch (err) {
    pending.className = 'msg err';
    pending.textContent = 'Error: ' + err.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
};
</script>
</body>
</html>
